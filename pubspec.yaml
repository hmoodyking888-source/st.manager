name: st_manager
description: ST_Manager - MikroTik Network Management
publish_to: 'none'
version: 2.5.7+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.2
  flutter_secure_storage: ^9.2.2
  routeros_api:
    git:
      url: https://github.com/ginkohub/routeros_api.git
  http: ^1.2.2
  url_launcher: ^6.3.0
  pdf: ^3.11.0
  printing: ^5.13.1
  share_plus: ^12.0.2
  fl_chart: ^0.69.0
  path_provider: ^2.1.4
  intl: ^0.19.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  syncfusion_flutter_gauges: ^27.1.48
  uuid: ^4.5.1
  equatable: ^2.0.7
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/templates/
    - assets/fonts/
    - assets/scripts/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/icon.png"